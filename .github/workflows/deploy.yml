name: 🚀 Deploy EBM App (SSH)

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: 🏗️ Build Web
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_URL=https://api.ebfic.store
      - name: 📤 Upload via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          source: "build/web/*"
          target: "public_html/ebm"
          strip_components: 2

  build-apps:
    runs-on: windows-latest
    if: github.event_name == 'release'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: 🏗️ Build APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_URL=https://api.ebfic.store
      - name: 🏗️ Build Windows
        run: flutter build windows --release --dart-define=API_URL=https://api.ebfic.store
      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/windows/x64/runner/Release/*.exe
